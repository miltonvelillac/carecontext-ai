[project]
name = "carecontext-api-host-rag"
version = "0.1.0"
description = "FastAPI RAG host for CareContext AI."
requires-python = ">=3.12"
dependencies = [
  "carecontext-contracts",
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "mcp>=1.0.0",
  "openai>=2.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0"
]

[tool.uv.sources]
carecontext-contracts = { path = "../../packages/carecontext-contracts", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"
