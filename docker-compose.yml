services:
  api-host-rag:
    build:
      context: .
      dockerfile: apps/api-host-rag/Dockerfile
    env_file:
      - .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - chroma

  web-react:
    build:
      context: ./apps/web-react
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api-host-rag

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  chroma-data:
